[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-agent-system"
version = "0.1.0"
description = "AI-powered personalized education tutor agent with long-term memory and RAG knowledge base"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.5.3,<1.0.0",
    "deepagents-acp>=0.0.6,<1.0.0",
    "ddgs>=8.1.1",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-pymupdf4llm>=0.5.0",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langgraph-cli[inmem]>=0.4.19",
    "markitdown>=0.1.5",
    "mcp>=1.27.0",
    "mem0ai[nlp]>=2.0.1",
    "pillow>=12.2.0",
    "psycopg-binary>=3.3.3",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic-settings>=2.0.0",
    "pymilvus>=2.6.12",
    "python-docx>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
